    <style>
      /* Reset e configurações base */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        font-family: "Inter", "Segoe UI", "Roboto", sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overflow-x: hidden;
      }

      /* Design System de Cores Profissional - ATUALIZADO */
      :root {
        --primary-color: #00a8ff;
        --primary-light: #4cd3ff;
        --primary-dark: #0077b6;
        --secondary-color: #8e9aaf;
        --accent-color: #ff9e00;
        --accent-light: #ffb74d;
        --success-color: #00d1b2;
        --warning-color: #ff9e00;
        --error-color: #ff3860;

        /* Tons de cinza profissionais atualizados */
        --gray-50: #f8fafc;
        --gray-100: #f1f5f9;
        --gray-200: #e2e8f0;
        --gray-300: #cbd5e1;
        --gray-400: #94a3b8;
        --gray-500: #64748b;
        --gray-600: #475569;
        --gray-700: #334155;
        --gray-800: #1e293b;
        --gray-900: #0f172a;

        /* Backgrounds atualizados */
        --bg-primary: #ffffff;
        --bg-secondary: rgba(248, 250, 252, 0.9);
        --bg-tertiary: rgba(241, 245, 249, 0.8);
        --bg-card: rgba(255, 255, 255, 0.95);
        --bg-glass: rgba(255, 255, 255, 0.1);

        /* Textos - ATUALIZADO para melhor contraste */
        --text-primary: #1e293b;
        --text-secondary: #475569;
        --text-tertiary: #64748b;
        --text-inverse: #ffffff;

        /* Bordas e sombras atualizadas */
        --border-light: rgba(226, 232, 240, 0.8);
        --border-medium: rgba(203, 213, 225, 0.8);
        --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        --shadow-2xl: 0 25px 50px -12px rgba(0, 0, 0, 0.25);

        /* Transições */
        --transition-fast: 0.15s cubic-bezier(0.4, 0, 0.2, 1);
        --transition-normal: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        --transition-slow: 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        --transition-spring: 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);

        /* Spacing profissional */
        --space-xs: 0.25rem;
        --space-sm: 0.5rem;
        --space-md: 1rem;
        --space-lg: 1.5rem;
        --space-xl: 2rem;
        --space-2xl: 3rem;
        --space-3xl: 4rem;

        /* Border radius corporativo */
        --radius-sm: 0.375rem;
        --radius-md: 0.5rem;
        --radius-lg: 0.75rem;
        --radius-xl: 1rem;
        --radius-2xl: 1.5rem;
      }

      /* Aplicação do tema */
      .app {
        min-height: 100vh;
        position: relative;
      }

      /* Video Background */
      .video-background {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
        overflow: hidden;
      }

      .video-background video {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      /* Efeito de Partículas */
      .particles {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: -1;
      }

      .particle {
        position: absolute;
        background: rgba(0, 168, 255, 0.3);
        border-radius: 50%;
        animation: float 15s infinite linear;
      }

      @keyframes float {
        0% {
          transform: translateY(0) translateX(0);
          opacity: 0;
        }
        10% {
          opacity: 1;
        }
        90% {
          opacity: 1;
        }
        100% {
          transform: translateY(-100vh) translateX(100px);
          opacity: 0;
        }
      }

      /* ============================================
              TELA DE LOGIN PROFISSIONAL
              ============================================ */
      .login-screen {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: var(--space-xl);
        position: relative;
      }

      .login-container {
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(25px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 24px;
        padding: 3rem 2.5rem;
        box-shadow: 0 8px 32px rgba(0, 168, 255, 0.2),
          0 0 0 1px rgba(255, 255, 255, 0.1) inset;
        max-width: 440px;
        width: 100%;
        animation: floatIn 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
      }

      .login-header {
        text-align: center;
        margin-bottom: var(--space-2xl);
      }

      .login-logo {
        width: 80px;
        height: 80px;
        margin: 0 auto var(--space-lg);
        background: rgba(255, 255, 255, 0.2);
        border-radius: var(--radius-2xl);
        display: flex;
        align-items: center;
        justify-content: center;
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.3);
      }

      .login-logo img {
        width: 50px;
        height: 50px;
        filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.2));
      }

      .login-title {
        font-size: 2.5rem;
        font-weight: 800;
        margin-bottom: var(--space-sm);
        background: linear-gradient(
          135deg,
          var(--primary-light),
          var(--primary-color)
        );
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        letter-spacing: -0.02em;
        line-height: 1.1;
      }

      .login-subtitle {
        font-size: 1.125rem;
        color: var(--text-inverse);
        font-weight: 500;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.3);
      }

      .login-form {
        display: flex;
        flex-direction: column;
        gap: var(--space-lg);
      }

      .form-group {
        display: flex;
        flex-direction: column;
        gap: var(--space-sm);
      }

      .form-label {
        color: var(--text-inverse);
        font-weight: 600;
        font-size: 0.875rem;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.3);
      }

      .form-input {
        padding: var(--space-md) var(--space-lg);
        background: rgba(255, 255, 255, 0.15);
        border: 2px solid rgba(255, 255, 255, 0.2);
        border-radius: var(--radius-xl);
        color: var(--text-inverse);
        font-size: 1rem;
        font-weight: 500;
        outline: none;
        transition: all var(--transition-normal);
        backdrop-filter: blur(10px);
      }

      .form-input::placeholder {
        color: rgba(255, 255, 255, 0.7);
      }

      .form-input:focus {
        border-color: var(--primary-light);
        background: rgba(255, 255, 255, 0.2);
        box-shadow: 0 0 0 4px rgba(0, 168, 255, 0.2);
      }

      .login-button {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: var(--space-sm);
        background: linear-gradient(
          135deg,
          var(--primary-color),
          var(--primary-dark)
        );
        color: white;
        border: none;
        padding: var(--space-lg);
        font-size: 1.125rem;
        font-weight: 600;
        border-radius: var(--radius-xl);
        cursor: pointer;
        transition: all var(--transition-normal);
        box-shadow: var(--shadow-lg);
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin-top: var(--space-md);
        position: relative;
        overflow: hidden;
      }

      .login-button::before {
        content: "";
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.2),
          transparent
        );
        transition: left 0.5s;
      }

      .login-button:hover::before {
        left: 100%;
      }

      .login-button:hover {
        transform: translateY(-2px);
        box-shadow: var(--shadow-xl);
      }

      .login-button:active {
        transform: translateY(0);
      }

      .login-button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        transform: none;
      }

      .error-message {
        background: rgba(255, 56, 96, 0.2);
        border: 1px solid rgba(255, 56, 96, 0.4);
        color: #ffebee;
        padding: var(--space-md);
        border-radius: var(--radius-lg);
        font-size: 0.875rem;
        font-weight: 500;
        text-align: center;
        backdrop-filter: blur(10px);
      }

      .login-footer {
        text-align: center;
        margin-top: var(--space-xl);
        color: var(--text-inverse);
        font-size: 0.875rem;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.3);
      }

      .company-name {
        color: var(--primary-light);
        font-weight: 700;
      }

      /* ============================================
              TELA DE BOAS-VINDAS PROFISSIONAL - ATUALIZADA
              ============================================ */
      .welcome-screen {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: var(--space-xl);
        position: relative;
      }

      .welcome-content {
        text-align: center;
        max-width: 600px;
        z-index: 1;
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(25px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 24px;
        padding: 3rem 2rem;
        box-shadow: 0 8px 32px rgba(0, 168, 255, 0.2),
          0 0 0 1px rgba(255, 255, 255, 0.1) inset;
        animation: floatIn 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
      }

      @keyframes floatIn {
        0% {
          opacity: 0;
          transform: translateY(30px) scale(0.95);
        }
        100% {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      .welcome-title {
        font-size: 3.5rem;
        font-weight: 800;
        margin-bottom: var(--space-lg);
        background: linear-gradient(
          135deg,
          var(--primary-light),
          var(--primary-color)
        );
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        letter-spacing: -0.02em;
        line-height: 1.1;
        text-shadow: 0 0 20px rgba(0, 168, 255, 0.5);
      }

      .subtitle-container {
        height: 2.5rem;
        margin-bottom: var(--space-2xl);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .welcome-subtitle {
        font-size: 1.25rem;
        font-weight: 500;
        color: var(--text-inverse);
        transition: all var(--transition-slow);
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.3);
      }

      .robot-container {
        margin: var(--space-2xl) 0;
        display: flex;
        justify-content: center;
      }

      .robot-image {
        width: 140px;
        height: 140px;
        border-radius: var(--radius-2xl);
        background: rgba(255, 255, 255, 0.2);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: var(--shadow-2xl);
        transition: all var(--transition-normal);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.3);
        animation: bounceGentle 3s ease-in-out infinite;
      }

      .robot-image:hover {
        transform: translateY(-4px) scale(1.05);
        box-shadow: 0 30px 60px rgba(0, 168, 255, 0.3);
      }

      .robot-icon {
        width: 80px;
        height: 80px;
        filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.2));
      }

      .company-info {
        font-size: 1.125rem;
        color: var(--text-inverse);
        margin-bottom: var(--space-2xl);
        font-weight: 500;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.3);
      }

      .start-button {
        display: inline-flex;
        align-items: center;
        gap: var(--space-sm);
        background: linear-gradient(
          135deg,
          var(--primary-color),
          var(--primary-dark)
        );
        color: white;
        border: none;
        padding: var(--space-lg) var(--space-2xl);
        font-size: 1.125rem;
        font-weight: 600;
        border-radius: var(--radius-xl);
        cursor: pointer;
        transition: all var(--transition-normal);
        box-shadow: var(--shadow-lg);
        text-transform: uppercase;
        letter-spacing: 0.05em;
        position: relative;
        overflow: hidden;
      }

      .start-button::before {
        content: "";
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.2),
          transparent
        );
        transition: left 0.5s;
      }

      .start-button:hover::before {
        left: 100%;
      }

      .start-button:hover {
        transform: translateY(-2px);
        box-shadow: var(--shadow-xl);
      }

      .start-button:active {
        transform: translateY(0);
      }

      /* ============================================
              CHAT CONTAINER PROFISSIONAL - ATUALIZADO
              ============================================ */
      .chat-container {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: var(--space-lg);
      }

      .phone-frame {
        width: 100%;
        max-width: 400px;
        height: 90vh;
        max-height: 700px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
        border-radius: 28px;
        border: 1px solid rgba(255, 255, 255, 0.8);
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25),
          0 0 0 1px rgba(255, 255, 255, 0.3) inset;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        position: relative;
      }

      @media (min-width: 768px) {
        .phone-frame {
          width: 420px;
          height: 85vh;
        }
      }

      /* Header profissional */
      .chat-header {
        background: linear-gradient(
          135deg,
          var(--primary-color),
          var(--primary-light)
        );
        padding: var(--space-lg);
        display: flex;
        align-items: center;
        justify-content: space-between;
        color: white;
        position: relative;
        box-shadow: var(--shadow-md);
        border-bottom: 1px solid rgba(255, 255, 255, 0.2);
      }

      .header-info {
        display: flex;
        align-items: center;
        gap: var(--space-md);
      }

      .header-avatar {
        width: 48px;
        height: 48px;
        background: rgba(255, 255, 255, 0.2);
        border-radius: var(--radius-xl);
        display: flex;
        align-items: center;
        justify-content: center;
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        transition: all var(--transition-normal);
      }

      .header-title {
        font-size: 1.125rem;
        font-weight: 700;
        margin-bottom: 2px;
        color: white;
      }

      .header-subtitle {
        font-size: 0.75rem;
        font-weight: 500;
        color: rgba(255, 255, 255, 0.8);
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      .close-button {
        width: 36px;
        height: 36px;
        border: none;
        background: rgba(255, 255, 255, 0.2);
        border-radius: var(--radius-lg);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all var(--transition-normal);
        color: white;
      }

      .close-button:hover {
        background: rgba(255, 255, 255, 0.3);
        transform: scale(1.05);
      }

      /* Container de mensagens */
      .messages-container {
        flex: 1;
        overflow-y: auto;
        padding: var(--space-lg);
        background: var(--bg-secondary);
        display: flex;
        flex-direction: column;
        gap: var(--space-md);
        scrollbar-width: thin;
        scrollbar-color: var(--primary-color) transparent;
      }

      .messages-container::-webkit-scrollbar {
        width: 6px;
      }

      .messages-container::-webkit-scrollbar-thumb {
        background: var(--primary-color);
        border-radius: 3px;
        opacity: 0.3;
      }

      /* Mensagens profissionais - CORRIGIDAS PARA MELHOR VISIBILIDADE */
      .message {
        max-width: 85%;
        padding: var(--space-md) var(--space-lg);
        border-radius: var(--radius-xl);
        line-height: 1.6;
        font-size: 0.875rem;
        animation: messageSlide 0.4s ease-out;
        position: relative;
        word-wrap: break-word;
        box-shadow: var(--shadow-sm);
      }

      @keyframes messageSlide {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .message.user {
        align-self: flex-end;
        background: linear-gradient(
          135deg,
          var(--primary-color),
          var(--primary-light)
        );
        color: white;
        border-bottom-right-radius: var(--radius-sm);
        font-weight: 600;
        box-shadow: 0 4px 15px rgba(0, 168, 255, 0.3);
      }

      .message.user strong {
        color: white;
      }

      .message.bot {
        align-self: flex-start;
        background: var(--bg-card);
        color: var(--text-primary);
        border: 1px solid var(--border-light);
        border-bottom-left-radius: var(--radius-sm);
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }

      .message.bot strong {
        color: var(--primary-color);
        font-weight: 700;
      }

      /* ESTILOS ESPECÍFICOS PARA RESPOSTAS ORGANIZADAS */
      .analysis-section {
        margin: var(--space-md) 0;
        padding: var(--space-lg);
        border-radius: var(--radius-lg);
        border-left: 4px solid;
      }

      .positive-section {
        background: linear-gradient(135deg, #e8f5e9, #c8e6c9);
        border-left-color: var(--success-color);
        color: #2e7d32;
      }

      .attention-section {
        background: linear-gradient(135deg, #fff3e0, #ffe0b2);
        border-left-color: var(--warning-color);
        color: #ef6c00;
      }

      .recommendations-section {
        background: linear-gradient(135deg, #e3f2fd, #bbdefb);
        border-left-color: var(--primary-color);
        color: #1565c0;
      }

      .info-section {
        background: linear-gradient(135deg, #f3e5f5, #e1bee7);
        border-left-color: var(--secondary-color);
        color: #7b1fa2;
      }

      .section-title {
        font-weight: 700;
        margin-bottom: var(--space-sm);
        display: flex;
        align-items: center;
        gap: var(--space-sm);
        font-size: 0.9rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      .section-content {
        font-size: 0.85rem;
        line-height: 1.5;
      }

      .section-content ul {
        margin: var(--space-sm) 0;
        padding-left: var(--space-lg);
      }

      .section-content li {
        margin-bottom: var(--space-xs);
      }

      .data-highlight {
        background: rgba(0, 168, 255, 0.1);
        padding: 2px 6px;
        border-radius: var(--radius-sm);
        font-weight: 600;
        color: var(--primary-dark);
      }

      /* Indicador de digitação */
      .typing-indicator {
        display: flex;
        align-items: center;
        gap: var(--space-sm);
        padding: var(--space-md) var(--space-lg);
        background: var(--bg-card);
        color: var(--text-secondary);
        border-radius: var(--radius-xl);
        border: 1px solid var(--border-light);
        font-size: 0.875rem;
        font-weight: 500;

        // ✅ FUNÇÃO MELHORADA: Chamar IA Google Cloud Function
        const callGoogleAI = async (

          if (!aiResponse) return [];

          // Divide por quebras de linha significativas
          const paragraphs = aiResponse
            .split(/\n\s*\n/)
            .filter((p) => p.trim());

          if (paragraphs.length <= 1) {
            // Se for curta, retorna como está
            return [aiResponse];
          }

          // Junta parágrafos muito curtos
          const merged = [];
          let current = "";

          paragraphs.forEach((paragraph) => {
            const cleanPara = paragraph.trim();
            if (cleanPara.split(" ").length < 15 && current) {
              current += "\n\n" + cleanPara;
            } else {
              if (current) merged.push(current);
              current = cleanPara;
            }
          });
          if (current) merged.push(current);

        // Função parseCSV robusta
        const parseCSVRobust = (text) => {
          const lines = [];
          const rawLines = text
            .trim()
            .split("\n")
            .filter((line) => line.trim());

          for (const line of rawLines) {
            const row = [];
            let cell = "";
            let inQuote = false;
            const cleanLine = line.replace(/\r$/, "");

            for (let i = 0; i < cleanLine.length; i++) {
              const char = cleanLine[i];
              if (char === '"') {
                if (inQuote && cleanLine[i + 1] === '"') {
                  cell += '"';
                  i++;
                } else {
                  inQuote = !inQuote;
                }
              } else if (char === "," && !inQuote) {
                row.push(cell.trim());
                cell = "";
              } else {
                cell += char;
              }
            }
            row.push(cell.trim());
            lines.push(row);
          }

<em>Estou aqui para conversar naturalmente sobre nossos estabelecimentos!</em>`,

            }, 800);
            return;

          if (messageLower === "/status" || messageLower === "status") {

              addMessage(

• ✅ <strong>Sistema online e funcionando</strong><br>
• 📈 <strong>${csvData.length} estabelecimentos</strong> carregados<br>
• 🧠 <strong>IA conversacional</strong> disponível<br>
• 🚀 <strong>Pronto para análises</strong><br><br>
<em>DIRETA MG - Raio-X Score 5 ativo!</em>`,
                "bot"
              );
            }, 600);
            return;
          }

          if (messageLower === "/dados" || messageLower === "dados") {
            if (csvData.length === 0) {
              addMessage("📋 *Ainda estou carregando os dados...*", "bot");
              return;
            }

            simulateTyping(() => {
              let response = `📋 **Estabelecimentos disponíveis:**<br><br>`;
              csvData.slice(0, 4).forEach((est, index) => {
                response += `${index + 1}. <strong>${est.eg}</strong> - ${
                  est.nome_fantasia
                }<br>`;
              });
              response += `<br>💡 <em>Digite qualquer código EG para análise detalhada</em>`;
              addMessage(response, "bot");
            }, 600);
            return;
          }

          // ✅ VERIFICAR SE É UM CÓDIGO EG PRIMEIRO
          const egPattern = /\d{2,6}-\d/;
          if (egPattern.test(message)) {
            const estabelecimento = findEstabelecimento(message);

            if (!estabelecimento) {
              // EG NÃO ENCONTRADO - AVISAR IMEDIATAMENTE
              addMessage(
                `❌ **Código ${message} não encontrado**<br><br>
Este código EG não está na nossa base de dados.<br>
Use <strong>/dados</strong> para ver os códigos disponíveis.<br><br>
<em>Base atual: ${csvData.length} estabelecimentos</em>`,
                "bot"
              );
              return;
            }

            // ✅ EG ENCONTRADO - ENVIAR DADOS REAIS PARA IA
            try {
              setIsTyping(true);
              const aiResponse = await callGoogleAI(
                message,
                csvData,
                estabelecimento
              );

              if (aiResponse) {
                setIsTyping(false);

                // Divide a resposta em partes menores
                const messageParts = splitAIMessage(aiResponse);

                if (messageParts.length > 1) {
                  // Se tiver múltiplas partes, envia sequencialmente
                  addSequentialMessages(messageParts, "bot");
                } else {
                  // Se for uma parte só, envia normal
                  addMessage(aiResponse.replace(/\n/g, "<br>"), "bot");
                }
              } else {
                setIsTyping(false);
                addMessage(
                  "🤔 *Não consegui processar sua solicitação. Tente novamente.*",
                  "bot"
                );
              }
            } catch (error) {
              console.error("Erro na IA:", error);
              setIsTyping(false);
              addMessage(
                "❌ *Estou com dificuldades técnicas. Tente novamente em instantes.*",
                "bot"
              );
            }
            return;
          }

          // ✅ MENSAGEM NORMAL - PROCESSAR COM IA SEM DADOS DE ESTABELECIMENTO
          try {
            setIsTyping(true);
            const aiResponse = await callGoogleAI(message, csvData);

            if (aiResponse) {
              setIsTyping(false);

              // Divide a resposta em partes menores
              const messageParts = splitAIMessage(aiResponse);

              if (messageParts.length > 1) {
                // Se tiver múltiplas partes, envia sequencialmente
                addSequentialMessages(messageParts, "bot");
              } else {
                // Se for uma parte só, envia normal
                addMessage(aiResponse.replace(/\n/g, "<br>"), "bot");
              }
            } else {
              setIsTyping(false);
              addMessage(
                "🤔 *Não consegui processar sua pergunta. Pode reformular?*",
                "bot"
              );
            }
          } catch (error) {
            console.error("Erro na IA:", error);
            setIsTyping(false);
            addMessage(
              "❌ *Estou com dificuldades técnicas. Tente novamente em instantes.*",
              "bot"
            );
          }
        };

        // ✅ INICIAR CHAT MODIFICADO
        const startChat = () => {
          setCurrentScreen("chat");
        };

        // ✅ VOLTAR AO LOGIN
        const handleLogout = () => {
          setCurrentScreen("login");
          setMessages([]);
          setUsername("");
          setPassword("");

        // Enviar mensagem
        const handleSubmit = async (e) => {
          e.preventDefault();
          const message = inputValue.trim();

          if (!message) {
            return;
          }

          setIsLoading(true);

          try {
            addMessage(`<strong>👤 Você:</strong> ${message}`, "user");
            await processMessage(message);
            setInputValue("");
          } catch (error) {
            console.error("Erro ao processar mensagem:", error);
            addMessage(
              "❌ *Não foi possível processar sua mensagem. Tente novamente.*",
              "bot"
            );
          } finally {
            setIsLoading(false);
          }
        };

        // Enter no input
        const handleKeyPress = (e) => {
          if (e.key === "Enter" && !e.shiftKey) {
            e.preventDefault();
            const message = inputValue.trim();
            if (message) {
              handleSubmit(e);
            }
          }
        };

        // Efeito para criar partículas após renderização
        React.useEffect(() => {
          const particles = createParticles();
          document.body.appendChild(particles);

          return () => {
            if (particles.parentNode) {
              particles.parentNode.removeChild(particles);
            }
          };
        }, []);

        // Renderizar tela de login
        if (currentScreen === "login") {
          return React.createElement("div", { className: "app" }, [
            React.createElement(

              {
                key: "video-background",
                className: "video-background",

                  key: "background-video",
                  autoPlay: true,
                  loop: true,
                  muted: true,

                }),

            React.createElement(
              "div",
              {
                key: "login",
                className: "login-screen",
              },
              [
                React.createElement(
                  "div",
                  {
                    key: "login-container",
                    className: "login-container",
                  },
                  [
                    React.createElement(
                      "div",
                      {
                        key: "login-header",
                        className: "login-header",
                      },
                      [
                        React.createElement(
                          "div",
                          {
                            key: "login-logo",
                            className: "login-logo",
                          },
                          [
                            React.createElement("img", {
                              key: "logo-icon",
                              src: "https://cdn-icons-png.flaticon.com/128/1698/1698535.png",
                              alt: "Raio-X Score 5",
                            }),
                          ]
                        ),
                        React.createElement(
                          "h1",
                          {
                            key: "login-title",
                            className: "login-title",
                          },
                          "Raio-X Score 5"
                        ),
                        React.createElement(
                          "p",
                          {
                            key: "login-subtitle",
                            className: "login-subtitle",
                          },
                          "Sistema de Inteligência de Dados"
                        ),
                      ]
                    ),

                    React.createElement(
                      "form",
                      {
                        key: "login-form",
                        onSubmit: handleLogin,
                        className: "login-form",
                      },
                      [
                        React.createElement(
                          "div",
                          {
                            key: "username-group",
                            className: "form-group",
                          },
                          [
                            React.createElement(
                              "label",

                            ),

                              value: username,
                              onChange: (e) => setUsername(e.target.value),

                        ),

                      // Ref para scroll
                      React.createElement("div", {

                        ref: messagesEndRef,

                  ),

                  // Input
                  React.createElement(
                    "div",
                    {
                      key: "input-container",
                      className: "input-container",
                    },
                    [
                      React.createElement(
                        "form",
                        {
                          key: "chat-form",
                          onSubmit: handleSubmit,
                          className: "chat-form",

                        [
                          React.createElement("input", {
                            key: "message-input",
                            ref: inputRef,
                            value: inputValue,
                            onChange: (e) => setInputValue(e.target.value),
                            onKeyDown: handleKeyPress,
                            type: "text",
                            placeholder: "Digite uma mensagem ou código EG...",
                            className: "message-input",
                            autoComplete: "off",

                          React.createElement(
                            "button",
                            {

                                "span",

                                "➤"
                              ),

                          ),

                      ),
                    ]
                  ),
                ]
              ),
            ]
          ),
        ]);
      }

      // ✅ CORREÇÃO DO REACT 18:
      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(React.createElement(App));
